<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>बाल विकास - अध्याय 1: A for Apple | IOIS PLATFORM</title>
  
  <!-- Fabric.js Free Drawing Canvas Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 10px; }
    
    /* Main Card Container */
    .workbook-card {
      background: #ffffff;
      width: 100%;
      max-width: 520px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
      padding: 15px;
      border: 2px solid #ffd700;
    }

    /* Header Styling */
    .header { text-align: center; margin-bottom: 12px; }
    .brand-title { color: #d97706; font-size: 22px; font-weight: bold; }
    .sub-title { color: #4b5563; font-size: 14px; margin-top: 2px; }

    /* Control Buttons Toolbar */
    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fffbe2;
      padding: 10px 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid #fef08a;
    }
    
    .color-options { display: flex; gap: 10px; align-items: center; }
    
    .color-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #ffffff;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      transition: transform 0.1s ease;
    }
    .color-btn:active { transform: scale(0.9); }
    .color-red { background: #ef4444; }
    .color-blue { background: #3b82f6; }
    .color-green { background: #22c55e; }
    .color-yellow { background: #eab308; }

    .action-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 13px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .action-btn:active { opacity: 0.9; }

    /* Canvas Wrapper */
    .canvas-container-wrapper {
      display: flex;
      justify-content: center;
      touch-action: none; /* Prevents scrolling while tracing */
      border-radius: 12px;
      overflow: hidden;
      border: 2px dashed #f59e0b;
    }
  </style>
</head>
<body>

  <div class="workbook-card">
    <!-- Branding Header -->
    <div class="header">
      <div class="brand-title">🌟 IOIS PLATFORM 🌟</div>
      <div class="sub-title">बाल विकास - भाग 1 (अध्याय 1: A for Apple)</div>
    </div>

    <!-- Drawing Tools Bar -->
    <div class="toolbar">
      <div class="color-options">
        <span style="font-size: 12px; font-weight: bold; color: #6b7280;">रंग:</span>
        <button class="color-btn color-red" onclick="changeColor('#ef4444')"></button>
        <button class="color-btn color-blue" onclick="changeColor('#3b82f6')"></button>
        <button class="color-btn color-green" onclick="changeColor('#22c55e')"></button>
        <button class="color-btn color-yellow" onclick="changeColor('#eab308')"></button>
      </div>
      <button class="action-btn" onclick="clearCanvas()">
        <span>🧹</span> मिटाएं (Reset)
      </button>
    </div>

    <!-- Interactive Drawing Canvas -->
    <div class="canvas-container-wrapper">
      <canvas id="workbook-canvas" width="480" height="680"></canvas>
    </div>
  </div>

  <script>
    // Initialize Fabric Canvas
    const canvas = new fabric.Canvas('workbook-canvas', {
      isDrawingMode: true
    });

    // Default Brush Settings
    canvas.freeDrawingBrush.width = 7;
    canvas.freeDrawingBrush.color = '#ef4444';

    // High-Quality 'A for Apple' Premium Background Page
    const bgImageUrl = 'https://i.ibb.co/VMy4v2d/A-For-Apple-Workbook-Page.png';

    function loadBackgroundImage() {
      fabric.Image.fromURL(bgImageUrl, function(img) {
        canvas.setBackgroundImage(img, canvas.renderAll.bind(canvas), {
          scaleX: canvas.width / img.width,
          scaleY: canvas.height / img.height
        });
      }, { crossOrigin: 'anonymous' });
    }

    // Load Image Initially
    loadBackgroundImage();

    // Change Brush Color Function
    function changeColor(color) {
      canvas.freeDrawingBrush.color = color;
    }

    // Clear Canvas Function
    function clearCanvas() {
      canvas.clear();
      loadBackgroundImage();
    }
  </script>
</body>
</html>
