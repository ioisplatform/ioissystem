<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A for Apple - Pure HTML 3D Animated Video Story</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #7dd3fc 0%, #0284c7 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
    }

    .card {
      width: 100%;
      max-width: 800px;
      background: #ffffff;
      border-radius: 24px;
      border: 5px solid #0284c7;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      padding: 14px;
      text-align: center;
    }

    .title { font-size: 24px; font-weight: 900; }
    .subtitle { font-size: 13px; color: #bae6fd; font-weight: bold; }

    /* Video Dialogue Banner */
    .speech-box {
      background: #fef08a;
      border-bottom: 3px solid #fde047;
      padding: 12px 15px;
      text-align: center;
      font-size: 17px;
      font-weight: 800;
      color: #854d0e;
      min-height: 55px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    /* Full Video Canvas Container */
    .canvas-container {
      position: relative;
      width: 100%;
      height: 400px;
      background: #ffffff;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #f8fafc;
      border-top: 2px solid #e2e8f0;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }

    .btn:active { transform: scale(0.95); }
    .btn-replay { background: #16a34a; }
    .btn-replay:hover { background: #15803d; }
    .btn-clear { background: #ef4444; }
    .btn-clear:hover { background: #dc2626; }
    
    .instruction {
      font-size: 13px;
      color: #0284c7;
      font-weight: bold;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="title">🎬 Live Animated Story: A for Apple</div>
      <div class="subtitle">🌟 IOIS PLATFORM 🌟</div>
    </div>

    <div class="speech-box" id="speechBox">
      🐜 चींटी: "नीचे 'प्ले एनिमेशन वीडियो' दबाएं, मैं चलकर आऊंगी और स्टोरी सुनाऊंगी!"
    </div>

    <div class="canvas-container">
      <canvas id="mainCanvas"></canvas>
    </div>

    <div class="controls">
      <button class="btn btn-replay" onclick="startFullVideoScene()">▶️ प्ले एनिमेशन वीडियो</button>
      <button class="btn btn-clear" onclick="clearUserDrawings()">🧹 अपनी ड्राइंग साफ़ करें</button>
      <div class="instruction">✍️ आप माउस या उंगली से 4-लाइन कॉपी पर लिखने की प्रैक्टिस कर सकते हैं!</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const speechBox = document.getElementById('speechBox');

    let w, h;
    let tCapA = 0, tSmallA = 0;
    let userPaths = [], currentPath = [], isDrawing = false;
    
    // Ant Animation Physics Parameters
    let antPos = { x: -50, y: 320, angle: 0 };
    let antTarget = { x: 0, y: 0 };
    let antLegAngle = 0;
    let isAntCarryingPiece = false;
    let isAntEating = false;

    function resizeCanvas() {
      w = canvas.width = canvas.offsetWidth;
      h = canvas.height = canvas.offsetHeight;
      antPos.x = 20;
      antPos.y = h - 50;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 4-Line Notebook Calculations (Top 3 lines for 'A', Middle 2 lines for 'a')
    function getLineY(row, lineIdx) {
      const base = row === 0 ? 50 : 210;
      return base + (lineIdx * 30);
    }

    // 100% ACCURATE 'A' TRACING (Slant Left, Slant Right, Center Crossbar)
    function getCapAPoint(t) {
      const l1 = getLineY(0, 0); // Line 1 (Top)
      const l3 = getLineY(0, 2); // Line 3 (Bottom boundary of A)
      const midY = getLineY(0, 1.2); // Line 2 (Crossbar)

      if (t <= 0.4) {
        // Step 1: Upward Slant (Left to Apex)
        let p = t / 0.4;
        return { x: 45 + 35 * p, y: l3 + (l1 - l3) * p };
      } else if (t <= 0.8) {
        // Step 2: Downward Slant (Apex to Right)
        let p = (t - 0.4) / 0.4;
        return { x: 80 + 35 * p, y: l1 + (l3 - l1) * p };
      } else {
        // Step 3: Horizontal Center Bar (Left to Right)
        let p = (t - 0.8) / 0.2;
        return { x: 60 + 40 * p, y: midY };
      }
    }

    // ACCURATE 'a' TRACING (Middle 2 lines)
    function getSmallAPoint(t) {
      const l2 = getLineY(1, 1);
      const l3 = getLineY(1, 2);
      const centerY = (l2 + l3) / 2;
      const r = (l3 - l2) / 2;
      const centerX = 80;

      if (t <= 0.75) {
        let angle = -(t / 0.75) * Math.PI * 2;
        return { x: centerX + Math.cos(angle) * r, y: centerY + Math.sin(angle) * r };
      } else {
        let p = (t - 0.75) / 0.25;
        return { x: centerX + r, y: l2 + (l3 - l2) * p };
      }
    }

    // Cute Child/Ant Voice Synthesis
    function speakAntVoice(text, callback) {
      speechBox.innerText = "🐜 चींटी: \"" + text + "\"";
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'hi-IN';
        msg.rate = 0.95;
        msg.pitch = 1.6;
        if (callback) msg.onend = callback;
        window.speechSynthesis.speak(msg);
      } else {
        if (callback) setTimeout(callback, 2200);
      }
    }

    // 3D Ultra Glossy Apple Graphic
    function drawUltraRealisticApple(cx, cy) {
      ctx.save();
      // Shadow
      ctx.beginPath();
      ctx.ellipse(cx, cy + 75, 75, 18, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.fill();

      // Stem
      ctx.beginPath();
      ctx.moveTo(cx - 2, cy - 45);
      ctx.quadraticCurveTo(cx - 15, cy - 80, cx - 22, cy - 85);
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#3d1e0b';
      ctx.lineCap = 'round';
      ctx.stroke();

      // Leaf
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy - 70);
      ctx.quadraticCurveTo(cx + 30, cy - 100, cx + 45, cy - 70);
      ctx.quadraticCurveTo(cx + 15, cy - 50, cx - 10, cy - 70);
      const leafGrad = ctx.createLinearGradient(cx - 10, cy - 90, cx + 45, cy - 50);
      leafGrad.addColorStop(0, '#4ade80');
      leafGrad.addColorStop(1, '#15803d');
      ctx.fillStyle = leafGrad;
      ctx.fill();

      // Apple Body Base
      ctx.beginPath();
      ctx.moveTo(cx, cy - 45);
      ctx.bezierCurveTo(cx + 50, cy - 65, cx + 85, cy - 10, cx + 75, cy + 35);
      ctx.bezierCurveTo(cx + 65, cy + 75, cx + 20, cy + 80, cx, cy + 65);
      ctx.bezierCurveTo(cx - 20, cy + 80, cx - 65, cy + 75, cx - 75, cy + 35);
      ctx.bezierCurveTo(cx - 85, cy - 10, cx - 50, cy - 65, cx, cy - 45);

      const appleGrad = ctx.createRadialGradient(cx - 25, cy - 20, 10, cx, cy, 85);
      appleGrad.addColorStop(0, '#ff4d4d');
      appleGrad.addColorStop(0.5, '#dc2626');
      appleGrad.addColorStop(0.85, '#991b1b');
      appleGrad.addColorStop(1, '#450a0a');
      ctx.fillStyle = appleGrad;
      ctx.fill();

      // Real Glossy Shine
      ctx.beginPath();
      ctx.ellipse(cx - 35, cy - 20, 16, 35, Math.PI / 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fill();

      ctx.restore();
    }

    // Walking / Crawling Animated 3D Ant
    function drawCrawlingAnt(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      antLegAngle += 0.25;
      let legOffset = Math.sin(antLegAngle) * 5;

      // Antennae
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(12, -4); ctx.quadraticCurveTo(20, -14, 25, -12);
      ctx.moveTo(12, 4);  ctx.quadraticCurveTo(20, 14, 25, 12);
      ctx.stroke();

      // Legs
      ctx.beginPath();
      ctx.moveTo(0, -2); ctx.lineTo(-5 + legOffset, -14);
      ctx.moveTo(-4, -2); ctx.lineTo(-4 - legOffset, -14);
      ctx.moveTo(-8, -2); ctx.lineTo(-13 + legOffset, -14);
      
      ctx.moveTo(0, 2);  ctx.lineTo(-5 - legOffset, 14);
      ctx.moveTo(-4, 2);  ctx.lineTo(-4 + legOffset, 14);
      ctx.moveTo(-8, 2);  ctx.lineTo(-13 - legOffset, 14);
      ctx.stroke();

      // Body Segments
      // Head
      ctx.beginPath(); ctx.ellipse(10, 0, 6, 5, 0, 0, Math.PI * 2); ctx.fillStyle = '#334155'; ctx.fill();
      // Eye
      ctx.beginPath(); ctx.arc(12, -2, 1.5, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
      // Thorax
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 5, 0, 0, Math.PI * 2); ctx.fillStyle = '#1e293b'; ctx.fill();
      // Abdomen
      ctx.beginPath(); ctx.ellipse(-14, 0, 11, 7, 0, 0, Math.PI * 2); ctx.fillStyle = '#0f172a'; ctx.fill();

      // Carrying/Eating Apple Piece
      if (isAntCarryingPiece || isAntEating) {
        ctx.beginPath();
        ctx.arc(18, 0, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#fef08a'; ctx.fill();
        ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 1; ctx.stroke();
      }

      ctx.restore();
    }

    function drawPencil(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.fill();
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-16, -7); ctx.lineTo(-16, 7); ctx.lineTo(-8, 4); ctx.fill();
      ctx.fillStyle = '#ea580c'; ctx.fillRect(-36, -7, 20, 14);
      ctx.restore();
    }

    // Main Engine Render Loop
    function render() {
      ctx.clearRect(0, 0, w, h);

      // 1. Draw 4-Line Notebook Background
      for (let r = 0; r < 2; r++) {
        for (let i = 0; i < 4; i++) {
          let y = getLineY(r, i);
          ctx.beginPath();
          ctx.moveTo(20, y);
          ctx.lineTo(w - 260, y);
          ctx.strokeStyle = (i === 0 || i === 3) ? '#ef4444' : '#3b82f6';
          ctx.lineWidth = 1.5;
          if (i === 1 || i === 2) ctx.setLineDash([5, 5]);
          else ctx.setLineDash([]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // 2. Faint Template Guide
      ctx.fillStyle = '#f1f5f9';
      ctx.font = '900 85px sans-serif';
      ctx.fillText('A', 40, getLineY(0, 2) - 2);
      ctx.font = '900 55px sans-serif';
      ctx.fillText('a', 68, getLineY(1, 2) - 2);

      // 3. Automated Pencil Tracing Animation
      if (tCapA < 1) tCapA += 0.005;
      drawPencilStroke(getCapAPoint, tCapA, '#0284c7');

      if (tSmallA < 1) tSmallA += 0.006;
      drawPencilStroke(getSmallAPoint, tSmallA, '#dc2626');

      // 4. Ultra-Realistic Apple Graphic
      const appleX = w - 140;
      const appleY = 140;
      drawUltraRealisticApple(appleX, appleY);

      // 5. Ant Walking Video Physics Engine
      let dx = antTarget.x - antPos.x;
      let dy = antTarget.y - antPos.y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 3) {
        antPos.x += (dx / dist) * 2;
        antPos.y += (dy / dist) * 2;
        antPos.angle = Math.atan2(dy, dx);
      }

      drawCrawlingAnt(antPos.x, antPos.y, antPos.angle);

      // 6. User Practice Traces
      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      userPaths.forEach(path => {
        ctx.beginPath();
        path.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
      });

      requestAnimationFrame(render);
    }

    function drawPencilStroke(pathFn, prog, color) {
      ctx.beginPath();
      ctx.lineWidth = 5;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let t = 0; t <= prog; t += 0.01) {
        let pt = pathFn(t);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      if (prog < 1) {
        let pt = pathFn(prog);
        drawPencil(pt.x, pt.y);
      }
    }

    // Complete Video Story Sequence
    function startFullVideoScene() {
      tCapA = 0;
      tSmallA = 0;
      isAntCarryingPiece = false;
      isAntEating = false;

      // Ant starts crawling towards center
      antTarget = { x: 120, y: getLineY(0, 2) + 20 };

      speakAntVoice("हेलो बच्चों! मैं छोटी चींटी हूँ! देखो, यह है Capital A और Small a!", () => {
        // Ant walks towards Apple
        antTarget = { x: w - 210, y: 190 };

        speakAntVoice("A for Apple! Apple का मतलब होता है सेब!", () => {
          // Ant picks up piece
          isAntCarryingPiece = true;

          speakAntVoice("अरे वाह! यह सेब तो बहुत मीठा और रसीला है! 🍎", () => {
            // Ant moves closer and eats
            isAntEating = true;
            speakAntVoice("और देखो, मैं चींटी की बच्ची मजे से सेब खा रही हूँ! आप भी मेरे साथ लिखो! 🐜🍎");
          });
        });
      });
    }

    // User Interactive Practice System
    function getEventPos(e) {
      let rect = canvas.getBoundingClientRect();
      let clientX = e.clientX || (e.touches && e.touches[0].clientX);
      let clientY = e.clientY || (e.touches && e.touches[0].clientY);
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      isDrawing = true;
      currentPath = [getEventPos(e)];
      userPaths.push(currentPath);
    }

    function drawMove(e) {
      if (!isDrawing) return;
      currentPath.push(getEventPos(e));
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', drawMove);
    canvas.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawMove(e); });
    canvas.addEventListener('touchend', stopDrawing);

    function clearUserDrawings() { userPaths = []; }

    // Start Engine Initial Position
    antTarget = { x: 100, y: 220 };
    render();
  </script>
</body>
</html>
