<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>बाल विकास - A for Apple Worksheet | IOIS PLATFORM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    body {
      background-color: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      user-select: none;
    }

    .worksheet-card {
      width: 100%;
      max-width: 550px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border: 3px solid #fbbf24;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header Section */
    .header {
      background: linear-gradient(135deg, #fffbeb, #fef3c7);
      padding: 16px;
      text-align: center;
      border-bottom: 2px dashed #f59e0b;
    }

    .brand-title {
      color: #d97706;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
      margin-top: 2px;
      letter-spacing: 1px;
    }

    .meta-bar {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 13px;
      font-weight: 700;
      color: #4b5563;
      padding: 0 10px;
    }

    /* Showcase Section (3D Letter & Realistic Apple) */
    .showcase {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 20px;
      background: #fafafa;
    }

    .letter-3d {
      font-size: 120px;
      font-weight: 900;
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(3px 5px 0px #fecaca);
    }

    .apple-img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.15));
    }

    /* Caption Banner */
    .caption-banner {
      background: #f0fdf4;
      border-top: 1px solid #bbf7d0;
      border-bottom: 1px solid #bbf7d0;
      text-align: center;
      padding: 10px;
      font-size: 20px;
      font-weight: 800;
      color: #166534;
    }

    /* Tracing Section */
    .tracing-section {
      padding: 15px;
      background: #ffffff;
      text-align: center;
    }

    .tracing-title {
      font-size: 14px;
      color: #6b7280;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 220px;
      border: 2px dashed #3b82f6;
      border-radius: 14px;
      background-color: #ffffff;
      touch-action: none;
      overflow: hidden;
    }

    /* Clean Notebook Guide Lines */
    .guide-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-evenly;
    }

    .line {
      width: 100%;
      height: 1px;
    }
    .line.red { border-bottom: 2px solid #fca5a5; }
    .line.blue { border-bottom: 1.5px dashed #93c5fd; }

    /* Trace Template Text */
    .trace-template {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 140px;
      font-weight: 900;
      color: #e5e7eb;
      letter-spacing: 35px;
      pointer-events: none;
      font-family: monospace, sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #fffbe2;
      border-top: 1px solid #fef08a;
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      transition: transform 0.1s ease;
    }
    .color-dot:active { transform: scale(0.9); }

    .btn-clear {
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.3);
    }
    .btn-clear:active { opacity: 0.9; }
  </style>
</head>
<body>

  <div class="worksheet-card">
    <!-- Header -->
    <div class="header">
      <div class="brand-title">बाल विकास: अध्ययन पुस्तिका</div>
      <div class="brand-subtitle">🌟 IOIS PLATFORM 🌟</div>
      <div class="meta-bar">
        <span>भाग 1: भाषा ज्ञान</span>
        <span>अध्याय 1: अंग्रेजी वर्णमाला</span>
      </div>
    </div>

    <!-- Showcase Area -->
    <div class="showcase">
      <div class="letter-3d">A</div>
      <!-- Ultra-Clean Realistic 3D Apple -->
      <img src="https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=400&auto=format&fit=crop&q=80" alt="Real Apple" class="apple-img">
    </div>

    <!-- Caption Banner -->
    <div class="caption-banner">
      ‘A’ FOR APPLE (एप्पल - सेब)
    </div>

    <!-- Tracing Canvas Area -->
    <div class="tracing-section">
      <div class="tracing-title">👇 उंगली या पेन से 'A' ट्रेस करें (Trace Here):</div>
      
      <div class="canvas-wrapper" id="canvasWrapper">
        <!-- Notebook Clean Lines -->
        <div class="guide-lines">
          <div class="line red"></div>
          <div class="line blue"></div>
          <div class="line blue"></div>
          <div class="line red"></div>
        </div>

        <!-- Trace Background Letter Template -->
        <div class="trace-template">A A</div>

        <!-- Smooth Interactive Canvas -->
        <canvas id="paintCanvas"></canvas>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <div class="color-picker">
        <span style="font-size: 13px; font-weight: 700; color: #4b5563;">रंग:</span>
        <div class="color-dot" style="background: #ef4444;" onclick="changeColor('#ef4444')"></div>
        <div class="color-dot" style="background: #2563eb;" onclick="changeColor('#2563eb')"></div>
        <div class="color-dot" style="background: #16a34a;" onclick="changeColor('#16a34a')"></div>
        <div class="color-dot" style="background: #d97706;" onclick="changeColor('#d97706')"></div>
      </div>
      <button class="btn-clear" onclick="clearCanvas()">🧹 मिटाएं (Reset)</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    let isDrawing = false;
    let currentColor = '#ef4444';

    function resizeCanvas() {
      // High-DPI screen sharp rendering
      const rect = wrapper.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = currentColor;
    }

    window.addEventListener('load', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    function changeColor(color) {
      currentColor = color;
      ctx.strokeStyle = color;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    // Mouse Controls
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Touch Controls for Mobile/Tablet
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);
  </script>
</body>
</html>
