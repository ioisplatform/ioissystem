<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>बाल विकास - Real Live Animated A & a | IOIS PLATFORM</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', 'Segoe UI', Roboto, sans-serif;
    }

    body {
      background-color: #e0f2fe;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      user-select: none;
    }

    .page-card {
      width: 100%;
      max-width: 580px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.12);
      border: 4px solid #0284c7;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #bae6fd, #e0f2fe);
      padding: 14px;
      text-align: center;
      border-bottom: 3px dashed #0284c7;
    }

    .brand-title {
      color: #0369a1;
      font-size: 24px;
      font-weight: 900;
    }

    .brand-subtitle {
      color: #0284c7;
      font-size: 13px;
      font-weight: 700;
    }

    /* 3D Showcase Badges */
    .showcase-badges {
      display: flex;
      justify-content: center;
      gap: 25px;
      padding: 15px;
      background: #f0f9ff;
    }

    .badge {
      width: 80px;
      height: 80px;
      background: #ffffff;
      border: 3px solid #0284c7;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      font-weight: 900;
      color: #0284c7;
      box-shadow: 0 6px 15px rgba(2, 132, 199, 0.2);
    }

    /* Interactive / Live Canvas Area */
    .animation-banner {
      background: #fef08a;
      padding: 8px;
      text-align: center;
      font-weight: 800;
      font-size: 14px;
      color: #854d0e;
      border-top: 1px solid #fde047;
      border-bottom: 1px solid #fde047;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 250px;
      background: #ffffff;
      border-bottom: 2px solid #e2e8f0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Controls */
    .control-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: #f8fafc;
    }

    .btn-replay {
      background: #0284c7;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(2, 132, 199, 0.3);
    }

    .btn-clear {
      background: #ef4444;
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      font-weight: 700;
      font-size: 13px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="page-card">
    <!-- Header -->
    <div class="header">
      <div class="brand-title">बाल विकास: अध्ययन पुस्तिका</div>
      <div class="brand-subtitle">🌟 IOIS PLATFORM 🌟</div>
    </div>

    <!-- Badges -->
    <div class="showcase-badges">
      <div class="badge">A</div>
      <div class="badge" style="color: #dc2626; border-color: #dc2626;">a</div>
    </div>

    <!-- Live Animated Guidance Canvas -->
    <div class="animation-banner">🎬 एनिमेटेड पेंसिल गाइड (लाइव पेंसिल को घूमते हुए देखें):</div>
    
    <div class="canvas-container">
      <canvas id="liveCanvas"></canvas>
    </div>

    <!-- Control Bar -->
    <div class="control-bar">
      <button class="btn-replay" onclick="resetAnimation()">🔄 दोबारा एनिमेशन देखें</button>
      <button class="btn-clear" onclick="clearUserTrace()">🧹 अपनी ट्रेसिंग साफ़ करें</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('liveCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    let progressA = 0;
    let progressSmallA = 0;
    let antPos = { x: 50, y: 190, angle: 0 };
    let userPaths = [];
    let isDrawing = false;
    let currentPath = [];

    // Realistic Apple Image
    const appleImg = new Image();
    appleImg.src = "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=200&auto=format&fit=crop&q=80";

    function resize() {
      width = canvas.width = canvas.offsetWidth;
      height = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Paths for Capital A & Small a
    function getCapAPoint(t) {
      // t goes 0 to 1
      if (t < 0.4) {
        // Line 1: Up-left to Top
        let localT = t / 0.4;
        return { x: 60 + localT * 30, y: 100 - localT * 70 };
      } else if (t < 0.8) {
        // Line 2: Top to Down-right
        let localT = (t - 0.4) / 0.4;
        return { x: 90 + localT * 30, y: 30 + localT * 70 };
      } else {
        // Line 3: Middle Bar
        let localT = (t - 0.8) / 0.2;
        return { x: 72 + localT * 36, y: 70 };
      }
    }

    function getSmallAPoint(t) {
      if (t < 0.7) {
        // Circle stroke
        let localT = t / 0.7;
        let angle = localT * Math.PI * 2;
        return { x: 230 + Math.cos(angle - Math.PI/2) * 18, y: 72 + Math.sin(angle - Math.PI/2) * 18 };
      } else {
        // Right vertical bar
        let localT = (t - 0.7) / 0.3;
        return { x: 248, y: 54 + localT * 36 };
      }
    }

    // Main Animation Loop
    let animFrame;
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Draw 4-Line English Notebook Background
      drawNotebookLines();

      // 2. Draw Faint Guide Letters
      drawFaintTemplates();

      // 3. Draw User Tracing Lines
      drawUserLines();

      // 4. Animate Pencil Drawing Capital A
      if (progressA < 1) progressA += 0.005;
      drawAnimatedStroke(getCapAPoint, progressA, '#0284c7');

      // 5. Animate Pencil Drawing Small a
      if (progressSmallA < 1) progressSmallA += 0.006;
      drawAnimatedStroke(getSmallAPoint, progressSmallA, '#dc2626');

      // 6. Draw Real Live Apple
      if (appleImg.complete) {
        ctx.drawImage(appleImg, width - 130, 130, 85, 85);
        ctx.fillStyle = '#dc2626';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('A for apple', width - 125, 230);
      }

      // 7. Draw Alive Crawling Ant
      updateAndDrawAnt();

      animFrame = requestAnimationFrame(animate);
    }

    function drawNotebookLines() {
      // Line group 1 (Capital A)
      const linesY = [30, 54, 78, 100];
      linesY.forEach((y, i) => {
        ctx.beginPath();
        ctx.moveTo(10, y);
        ctx.lineTo(width - 150, y);
        ctx.strokeStyle = (i === 0 || i === 3) ? '#ef4444' : '#3b82f6';
        ctx.lineWidth = 1.5;
        ctx.setLineDash((i === 1 || i === 2) ? [4, 4] : []);
        ctx.stroke();
        ctx.setLineDash([]);
      });

      // Line group 2 (Small a row)
      const linesY2 = [130, 154, 178, 200];
      linesY2.forEach((y, i) => {
        ctx.beginPath();
        ctx.moveTo(10, y);
        ctx.lineTo(width - 150, y);
        ctx.strokeStyle = (i === 0 || i === 3) ? '#ef4444' : '#3b82f6';
        ctx.lineWidth = 1.5;
        ctx.setLineDash((i === 1 || i === 2) ? [4, 4] : []);
        ctx.stroke();
        ctx.setLineDash([]);
      });
    }

    function drawFaintTemplates() {
      ctx.fillStyle = '#e2e8f0';
      ctx.font = 'bold 70px monospace';
      ctx.fillText('A', 60, 95);
      ctx.font = 'bold 50px monospace';
      ctx.fillText('a', 220, 90);
    }

    function drawAnimatedStroke(pointFunc, prog, color) {
      ctx.beginPath();
      ctx.lineWidth = 5;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';

      for (let t = 0; t <= prog; t += 0.01) {
        let pt = pointFunc(t);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      // Draw Animated Pencil Tip
      if (prog < 1) {
        let currentPt = pointFunc(prog);
        drawPencilTip(currentPt.x, currentPt.y);
      }
    }

    function drawPencilTip(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 4);
      
      // Pencil Body
      ctx.fillStyle = '#f59e0b';
      ctx.fillRect(0, -5, 30, 10);
      
      // Pencil Wood Tip
      ctx.fillStyle = '#fde047';
      ctx.beginPath();
      ctx.moveTo(0, -5);
      ctx.lineTo(-10, 0);
      ctx.lineTo(0, 5);
      ctx.fill();

      // Graphite Lead
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.moveTo(-6, -3);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-6, 3);
      ctx.fill();

      ctx.restore();
    }

    // Crawling Ant Logic
    let legWiggle = 0;
    function updateAndDrawAnt() {
      legWiggle += 0.2;
      antPos.x += 0.4;
      if (antPos.x > width - 160) antPos.x = 20;

      ctx.save();
      ctx.translate(antPos.x, antPos.y);

      // Legs
      ctx.strokeStyle = '#451a03';
      ctx.lineWidth = 2;
      for (let i = -1; i <= 1; i++) {
        let offset = Math.sin(legWiggle + i) * 4;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(i * 8, -10 + offset);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(i * 8, 10 - offset);
        ctx.stroke();
      }

      // Body Parts
      ctx.fillStyle = '#78350f';
      ctx.beginPath(); ctx.arc(-12, 0, 8, 0, Math.PI * 2); ctx.fill(); // Back
      ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI * 2); ctx.fill();  // Mid
      ctx.beginPath(); ctx.arc(10, 0, 6, 0, Math.PI * 2); ctx.fill(); // Head

      // Eye & Antenna
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(12, -2, 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#451a03';
      ctx.beginPath(); ctx.moveTo(14, -3); ctx.lineTo(20, -8 + Math.sin(legWiggle)*2); ctx.stroke();

      ctx.restore();

      ctx.fillStyle = '#78350f';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('A for ant', antPos.x - 10, antPos.y + 22);
    }

    // Drawing Tracing Functionality for User
    function drawUserLines() {
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      userPaths.forEach(path => {
        ctx.beginPath();
        path.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
      });
    }

    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      let rect = canvas.getBoundingClientRect();
      currentPath = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
      userPaths.push(currentPath);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      let rect = canvas.getBoundingClientRect();
      currentPath.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
    });

    canvas.addEventListener('mouseup', () => isDrawing = false);

    canvas.addEventListener('touchstart', (e) => {
      isDrawing = true;
      let rect = canvas.getBoundingClientRect();
      let touch = e.touches[0];
      currentPath = [{ x: touch.clientX - rect.left, y: touch.clientY - rect.top }];
      userPaths.push(currentPath);
    });

    canvas.addEventListener('touchmove', (e) => {
      if (!isDrawing) return;
      let rect = canvas.getBoundingClientRect();
      let touch = e.touches[0];
      currentPath.push({ x: touch.clientX - rect.left, y: touch.clientY - rect.top });
    });

    canvas.addEventListener('touchend', () => isDrawing = false);

    function resetAnimation() {
      progressA = 0;
      progressSmallA = 0;
    }

    function clearUserTrace() {
      userPaths = [];
    }

    appleImg.onload = () => {
      animate();
    };
  </script>
</body>
</html>
