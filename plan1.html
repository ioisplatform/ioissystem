<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>बाल विकास - A for Apple Worksheet</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    body {
      background-color: #f5f7fa;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      user-select: none;
    }

    .worksheet-container {
      width: 100%;
      max-width: 650px;
      background: #ffffff;
      border: 4px solid #4A90E2;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header Styling */
    .header {
      background: linear-gradient(135deg, #fff3e0, #ffe0b2);
      padding: 15px;
      text-align: center;
      border-bottom: 3px dashed #ff9800;
      position: relative;
    }

    .brand-title {
      color: #e65100;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .brand-subtitle {
      color: #1565c0;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .meta-info {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
      padding: 0 10px;
    }

    /* Main Showcase Section */
    .showcase {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 25px 15px;
      background-color: #fafafa;
    }

    .letter-box {
      font-size: 110px;
      font-weight: 900;
      color: #ff5722;
      text-shadow: 4px 4px 0px #ffe0b2, 6px 6px 0px #e65100;
    }

    .illustration {
      width: 140px;
      height: 140px;
    }

    /* Caption Label */
    .caption-banner {
      background: #e8f5e9;
      border-top: 2px solid #a5d6a7;
      border-bottom: 2px solid #a5d6a7;
      text-align: center;
      padding: 12px;
      font-size: 22px;
      font-weight: bold;
      color: #2e7d32;
    }

    /* Tracing / Canvas Section */
    .tracing-section {
      padding: 20px;
      background: #ffffff;
      text-align: center;
    }

    .tracing-title {
      font-size: 16px;
      color: #555;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .canvas-wrapper {
      position: relative;
      width: 100%;
      height: 260px;
      border: 2px dashed #90caf9;
      border-radius: 12px;
      background-color: #fff;
      touch-action: none; /* Mobile tracing Support */
    }

    /* Tracing Line Guidelines inside Canvas Wrapper */
    .guide-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 10px 0;
    }

    .line {
      width: 100%;
      border-bottom: 2px dotted #cccccc;
    }

    .line.red {
      border-bottom: 2px solid #ef5350;
    }

    .line.blue {
      border-bottom: 2px solid #42a5f5;
    }

    /* Tracing Reference Text behind canvas */
    .trace-template {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 160px;
      font-weight: bold;
      color: #e0e0e0;
      letter-spacing: 20px;
      pointer-events: none;
      border-style: dotted;
      font-family: monospace, sans-serif;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      cursor: crosshair;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: center;
      gap: 15px;
      padding: 15px;
      background: #f1f8e9;
    }

    .btn {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-clear {
      background-color: #f44336;
      color: white;
    }

    .btn-clear:hover {
      background-color: #d32f2f;
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      cursor: pointer;
      border: 2px solid #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

  <div class="worksheet-container">
    <!-- Header -->
    <div class="header">
      <div class="brand-title">बाल विकास: अध्ययन पुस्तिका</div>
      <div class="brand-subtitle">IOIS PLATFORM</div>
      <div class="meta-info">
        <span>भाग 1: भाषा ज्ञान</span>
        <span>अध्याय 1: अंग्रेजी वर्णमाला</span>
      </div>
    </div>

    <!-- Letter & Apple SVG Showcase -->
    <div class="showcase">
      <div class="letter-box">A</div>
      
      <!-- Vector Apple Illustration (No External Image Required) -->
      <div class="illustration">
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <!-- Leaf -->
          <path d="M100,50 Q130,20 120,50 Q110,70 100,50 Z" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
          <!-- Stem -->
          <path d="M100,50 Q95,35 102,20" fill="none" stroke="#5D4037" stroke-width="6" stroke-linecap="round"/>
          <!-- Apple Body -->
          <path d="M100,60 C120,40 170,50 170,100 C170,150 120,180 100,165 C80,180 30,150 30,100 C30,50 80,40 100,60 Z" fill="#E53935" stroke="#B71C1C" stroke-width="3"/>
          <!-- Highlight / Gloss Effect -->
          <ellipse cx="65" cy="85" rx="12" ry="25" fill="#FFFFFF" opacity="0.3" transform="rotate(-30 65 85)"/>
        </svg>
      </div>
    </div>

    <!-- Caption -->
    <div class="caption-banner">
      ‘A’ FOR APPLE (एप्पल - सेब)
    </div>

    <!-- Tracing Canvas Area -->
    <div class="tracing-section">
      <div class="tracing-title">उंगली या माउस से 'A' लिखने का अभ्यास करें (Trace Here):</div>
      
      <div class="canvas-wrapper" id="canvasWrapper">
        <!-- Notebook Lines -->
        <div class="guide-lines">
          <div class="line red"></div>
          <div class="line blue"></div>
          <div class="line blue"></div>
          <div class="line red"></div>
        </div>

        <!-- Faint Tracing Outline -->
        <div class="trace-template">A A</div>

        <!-- Interactive Canvas -->
        <canvas id="paintCanvas"></canvas>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-clear" onclick="clearCanvas()">साफ़ करें (Clear)</button>
      <div class="color-picker">
        <div class="color-dot" style="background: #2196F3;" onclick="changeColor('#2196F3')"></div>
        <div class="color-dot" style="background: #4CAF50;" onclick="changeColor('#4CAF50')"></div>
        <div class="color-dot" style="background: #E91E63;" onclick="changeColor('#E91E63')"></div>
        <div class="color-dot" style="background: #000000;" onclick="changeColor('#000000')"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');

    let isDrawing = false;
    let currentColor = '#2196F3';

    // Resize canvas dynamically to match container size
    function resizeCanvas() {
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = currentColor;
    }

    window.addEventListener('load', resizeCanvas);
    window.addEventListener('resize', resizeCanvas);

    function changeColor(color) {
      currentColor = color;
      ctx.strokeStyle = color;
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    // Get Mouse / Touch Pos
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function startDrawing(e) {
      isDrawing = true;
      const pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    }

    function draw(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    }

    function stopDrawing() {
      isDrawing = false;
    }

    // Mouse Events
    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDrawing);
    canvas.addEventListener('mouseleave', stopDrawing);

    // Touch Events for Mobile / Tablet
    canvas.addEventListener('touchstart', startDrawing);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDrawing);
  </script>
</body>
</html>
