<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A for Apple - Animated Kids Learning Video & Tracing</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #38bdf8 0%, #0369a1 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
    }

    .card {
      width: 100%;
      max-width: 850px;
      background: #ffffff;
      border-radius: 24px;
      border: 5px solid #0284c7;
      overflow: hidden;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      display: flex;
      flex-direction: column;
    }

    .header {
      background: linear-gradient(135deg, #0284c7, #075985);
      color: #ffffff;
      padding: 14px;
      text-align: center;
    }

    .title { font-size: 24px; font-weight: 900; }
    .subtitle { font-size: 13px; color: #bae6fd; font-weight: bold; }

    /* Interactive Ant Dialogue Banner */
    .speech-box {
      background: #fef08a;
      border-bottom: 3px solid #fde047;
      padding: 12px 15px;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
      color: #713f12;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    /* Video Canvas Area */
    .canvas-container {
      position: relative;
      width: 100%;
      height: 420px;
      background: #ffffff;
      touch-action: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* Bottom Control Bar */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #f8fafc;
      border-top: 2px solid #e2e8f0;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: all 0.2s ease;
    }

    .btn:active { transform: scale(0.95); }
    .btn-play { background: #16a34a; }
    .btn-play:hover { background: #15803d; }
    .btn-clear { background: #ef4444; }
    .btn-clear:hover { background: #dc2626; }
    
    .instruction {
      font-size: 13px;
      color: #0284c7;
      font-weight: bold;
      width: 100%;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header">
      <div class="title">🎬 Real Animated Video Story: Learn 'A' & 'Apple'</div>
      <div class="subtitle">🌟 IOIS PLATFORM 🌟</div>
    </div>

    <!-- Ant Voice Dialogue Display -->
    <div class="speech-box" id="speechBox">
      🐜 चींटी: "नमस्ते बच्चों! नीचे 'प्ले वीडियो कहानी' बटन दबाएं, मैं आपको A लिखना सिखाऊंगी!"
    </div>

    <!-- Canvas Animation Area -->
    <div class="canvas-container">
      <canvas id="mainCanvas"></canvas>
    </div>

    <!-- Buttons & Instructions -->
    <div class="controls">
      <button class="btn btn-play" onclick="startFullVideoScene()">▶️ प्ले वीडियो कहानी</button>
      <button class="btn btn-clear" onclick="clearUserDrawings()">🧹 ड्राइंग साफ़ करें</button>
      <div class="instruction">✍️ बच्चे माउस या उंगली से स्क्रीन पर 4-लाइन कॉपी की तरह प्रैक्टिस कर सकते हैं!</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const speechBox = document.getElementById('speechBox');

    let w, h;
    let tCapA = 0, tSmallA = 0;
    let userPaths = [], currentPath = [], isDrawing = false;
    
    // Physics parameters for crawling Ant Video Scene
    let antPos = { x: 30, y: 340, angle: 0 };
    let antTarget = { x: 30, y: 340 };
    let antLegAngle = 0;
    let isAntCarryingPiece = false;
    let isAntEating = false;

    function resizeCanvas() {
      w = canvas.width = canvas.offsetWidth;
      h = canvas.height = canvas.offsetHeight;
      antPos.x = 40;
      antPos.y = h - 60;
      antTarget.x = 40;
      antTarget.y = h - 60;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 4-Line Notebook Coordinates (Row 0 for Capital A, Row 1 for Small a)
    function getLineY(row, lineIdx) {
      const base = row === 0 ? 45 : 210;
      return base + (lineIdx * 32);
    }

    // PERFECT CAPITAL 'A' PATH (3-STROKES)
    function getCapAPoint(t) {
      const l1 = getLineY(0, 0); // Top Red Line
      const l3 = getLineY(0, 2); // Bottom Blue Line
      const midY = getLineY(0, 1.2); // Middle Bar Line

      if (t <= 0.4) {
        // Stroke 1: Left Slant Line (Bottom to Top)
        let p = t / 0.4;
        return { x: 45 + 35 * p, y: l3 + (l1 - l3) * p };
      } else if (t <= 0.8) {
        // Stroke 2: Right Slant Line (Top to Bottom)
        let p = (t - 0.4) / 0.4;
        return { x: 80 + 35 * p, y: l1 + (l3 - l1) * p };
      } else {
        // Stroke 3: Sleeping Crossbar Line (Left to Right)
        let p = (t - 0.8) / 0.2;
        return { x: 60 + 40 * p, y: midY };
      }
    }

    // PERFECT SMALL 'a' PATH (Circle + Standing Line)
    function getSmallAPoint(t) {
      const l2 = getLineY(1, 1);
      const l3 = getLineY(1, 2);
      const centerY = (l2 + l3) / 2;
      const r = (l3 - l2) / 2;
      const centerX = 80;

      if (t <= 0.75) {
        let angle = -(t / 0.75) * Math.PI * 2;
        return { x: centerX + Math.cos(angle) * r, y: centerY + Math.sin(angle) * r };
      } else {
        let p = (t - 0.75) / 0.25;
        return { x: centerX + r, y: l2 + (l3 - l2) * p };
      }
    }

    // Child-pitched voice speech synthesis
    function speakAntVoice(text, callback) {
      speechBox.innerText = "🐜 चींटी: \"" + text + "\"";
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'hi-IN';
        msg.rate = 0.92;
        msg.pitch = 1.6;
        if (callback) msg.onend = callback;
        window.speechSynthesis.speak(msg);
      } else {
        if (callback) setTimeout(callback, 2400);
      }
    }

    // Real Glossy 3D Apple Rendering
    function drawUltraRealisticApple(cx, cy) {
      ctx.save();
      // Drop Shadow
      ctx.beginPath();
      ctx.ellipse(cx, cy + 75, 75, 18, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fill();

      // Stem
      ctx.beginPath();
      ctx.moveTo(cx - 2, cy - 45);
      ctx.quadraticCurveTo(cx - 15, cy - 80, cx - 22, cy - 85);
      ctx.lineWidth = 7;
      ctx.strokeStyle = '#3d1e0b';
      ctx.lineCap = 'round';
      ctx.stroke();

      // Leaf
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy - 70);
      ctx.quadraticCurveTo(cx + 30, cy - 100, cx + 45, cy - 70);
      ctx.quadraticCurveTo(cx + 15, cy - 50, cx - 10, cy - 70);
      const leafGrad = ctx.createLinearGradient(cx - 10, cy - 90, cx + 45, cy - 50);
      leafGrad.addColorStop(0, '#4ade80');
      leafGrad.addColorStop(1, '#15803d');
      ctx.fillStyle = leafGrad;
      ctx.fill();

      // Apple Body Gradient
      ctx.beginPath();
      ctx.moveTo(cx, cy - 45);
      ctx.bezierCurveTo(cx + 50, cy - 65, cx + 85, cy - 10, cx + 75, cy + 35);
      ctx.bezierCurveTo(cx + 65, cy + 75, cx + 20, cy + 80, cx, cy + 65);
      ctx.bezierCurveTo(cx - 20, cy + 80, cx - 65, cy + 75, cx - 75, cy + 35);
      ctx.bezierCurveTo(cx - 85, cy - 10, cx - 50, cy - 65, cx, cy - 45);

      const appleGrad = ctx.createRadialGradient(cx - 25, cy - 20, 10, cx, cy, 85);
      appleGrad.addColorStop(0, '#ff4d4d');
      appleGrad.addColorStop(0.5, '#dc2626');
      appleGrad.addColorStop(0.85, '#991b1b');
      appleGrad.addColorStop(1, '#450a0a');
      ctx.fillStyle = appleGrad;
      ctx.fill();

      // Glossy Reflection Highlight
      ctx.beginPath();
      ctx.ellipse(cx - 35, cy - 20, 16, 35, Math.PI / 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fill();

      ctx.restore();
    }

    // 3D Crawling Ant Character
    function drawCrawlingAnt(x, y, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);

      antLegAngle += 0.25;
      let legOffset = Math.sin(antLegAngle) * 5;

      // Antennae
      ctx.strokeStyle = '#0f172a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(12, -4); ctx.quadraticCurveTo(20, -14, 25, -12);
      ctx.moveTo(12, 4);  ctx.quadraticCurveTo(20, 14, 25, 12);
      ctx.stroke();

      // 6 Moving Legs
      ctx.beginPath();
      ctx.moveTo(0, -2); ctx.lineTo(-5 + legOffset, -14);
      ctx.moveTo(-4, -2); ctx.lineTo(-4 - legOffset, -14);
      ctx.moveTo(-8, -2); ctx.lineTo(-13 + legOffset, -14);
      
      ctx.moveTo(0, 2);  ctx.lineTo(-5 - legOffset, 14);
      ctx.moveTo(-4, 2);  ctx.lineTo(-4 + legOffset, 14);
      ctx.moveTo(-8, 2);  ctx.lineTo(-13 - legOffset, 14);
      ctx.stroke();

      // Ant Body Segments
      // Head
      ctx.beginPath(); ctx.ellipse(10, 0, 6, 5, 0, 0, Math.PI * 2); ctx.fillStyle = '#334155'; ctx.fill();
      // Eye
      ctx.beginPath(); ctx.arc(12, -2, 1.5, 0, Math.PI * 2); ctx.fillStyle = '#ffffff'; ctx.fill();
      // Thorax
      ctx.beginPath(); ctx.ellipse(0, 0, 7, 5, 0, 0, Math.PI * 2); ctx.fillStyle = '#1e293b'; ctx.fill();
      // Abdomen
      ctx.beginPath(); ctx.ellipse(-14, 0, 11, 7, 0, 0, Math.PI * 2); ctx.fillStyle = '#0f172a'; ctx.fill();

      // Piece of Apple carried by Ant
      if (isAntCarryingPiece || isAntEating) {
        ctx.beginPath();
        ctx.arc(18, 0, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#fef08a'; ctx.fill();
        ctx.strokeStyle = '#ca8a04'; ctx.lineWidth = 1; ctx.stroke();
      }

      ctx.restore();
    }

    // Pencil Drawing Component
    function drawPencil(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.fill();
      ctx.fillStyle = '#fde047'; ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-16, -7); ctx.lineTo(-16, 7); ctx.lineTo(-8, 4); ctx.fill();
      ctx.fillStyle = '#ea580c'; ctx.fillRect(-36, -7, 20, 14);
      ctx.restore();
    }

    // Main Canvas Render Loop
    function render() {
      ctx.clearRect(0, 0, w, h);

      // 1. Draw 4-Line Notebook Lines
      for (let r = 0; r < 2; r++) {
        for (let i = 0; i < 4; i++) {
          let y = getLineY(r, i);
          ctx.beginPath();
          ctx.moveTo(20, y);
          ctx.lineTo(w - 260, y);
          ctx.strokeStyle = (i === 0 || i === 3) ? '#ef4444' : '#3b82f6';
          ctx.lineWidth = 1.5;
          if (i === 1 || i === 2) ctx.setLineDash([5, 5]);
          else ctx.setLineDash([]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // 2. Faint Background Letters for Reference
      ctx.fillStyle = '#f1f5f9';
      ctx.font = '900 90px sans-serif';
      ctx.fillText('A', 40, getLineY(0, 2) - 2);
      ctx.font = '900 58px sans-serif';
      ctx.fillText('a', 68, getLineY(1, 2) - 2);

      // 3. Automated Pencil Tracing Animation
      if (tCapA < 1) tCapA += 0.005;
      drawPencilStroke(getCapAPoint, tCapA, '#0284c7');

      if (tSmallA < 1) tSmallA += 0.006;
      drawPencilStroke(getSmallAPoint, tSmallA, '#dc2626');

      // 4. Ultra-Realistic Apple Graphic
      const appleX = w - 140;
      const appleY = 140;
      drawUltraRealisticApple(appleX, appleY);

      // 5. Ant Crawling Physics Update
      let dx = antTarget.x - antPos.x;
      let dy = antTarget.y - antPos.y;
      let dist = Math.sqrt(dx * dx + dy * dy);

      if (dist > 3) {
        antPos.x += (dx / dist) * 2;
        antPos.y += (dy / dist) * 2;
        antPos.angle = Math.atan2(dy, dx);
      }

      drawCrawlingAnt(antPos.x, antPos.y, antPos.angle);

      // 6. User Tracing & Freehand Practice Paths
      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      userPaths.forEach(path => {
        ctx.beginPath();
        path.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
      });

      requestAnimationFrame(render);
    }

    function drawPencilStroke(pathFn, prog, color) {
      ctx.beginPath();
      ctx.lineWidth = 5;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let t = 0; t <= prog; t += 0.01) {
        let pt = pathFn(t);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      if (prog < 1) {
        let pt = pathFn(prog);
        drawPencil(pt.x, pt.y);
      }
    }

    // STORY SCENE & TEACHING DIALOGUE PIPELINE
    function startFullVideoScene() {
      tCapA = 0;
      tSmallA = 0;
      isAntCarryingPiece = false;
      isAntEating = false;

      // Ant walks to letter 'A'
      antTarget = { x: 130, y: getLineY(0, 2) + 20 };

      speakAntVoice("नमस्ते बच्चों! मैं छोटी चींटी हूँ! चलो आज 'A' लिखना सीखते हैं!", () => {
        speakAntVoice("देखो पेंसिल को! पहले बाएं तिरछी लाइन, फिर दाएं तिरछी लाइन और बीच में सीधी लाइन! बन गया Capital A!", () => {
          // Ant walks towards Apple
          antTarget = { x: w - 210, y: 190 };

          speakAntVoice("A for Apple! Apple यानी सेब! और A for Ant... Ant यानी मैं चींटी!", () => {
            // Ant picks apple piece
            isAntCarryingPiece = true;

            speakAntVoice("वाह! सेब कितना मीठा और रसीला है! 🍎", () => {
              isAntEating = true;
              speakAntVoice("अब आप सब भी स्क्रीन पर अपनी उंगली से 'A' लिखने की प्रैक्टिस करो! 🐜✨");
            });
          });
        });
      });
    }

    // FULL USER TRACING & DRAWING ENGINE
    function getEventPos(e) {
      let rect = canvas.getBoundingClientRect();
      let clientX = e.clientX || (e.touches && e.touches[0].clientX);
      let clientY = e.clientY || (e.touches && e.touches[0].clientY);
      return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function startDrawing(e) {
      isDrawing = true;
      currentPath = [getEventPos(e)];
      userPaths.push(currentPath);
    }

    function drawMove(e) {
      if (!isDrawing) return;
      currentPath.push(getEventPos(e));
    }

    function stopDrawing() { isDrawing = false; }

    canvas.addEventListener('mousedown', startDrawing);
    canvas.addEventListener('mousemove', drawMove);
    canvas.addEventListener('mouseup', stopDrawing);

    canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); });
    canvas.addEventListener('touchmove', (e) => { e.preventDefault(); drawMove(e); });
    canvas.addEventListener('touchend', stopDrawing);

    function clearUserDrawings() { userPaths = []; }

    // Start engine loop
    render();
  </script>
</body>
</html>
