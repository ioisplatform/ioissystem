<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A for Apple - Real Notebook Tracing & Animated Ant</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      user-select: none;
    }

    .card {
      width: 100%;
      max-width: 680px;
      background: #ffffff;
      border-radius: 24px;
      border: 4px solid #0284c7;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(2, 132, 199, 0.2);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      padding: 16px;
      text-align: center;
    }

    .title {
      font-size: 24px;
      font-weight: 900;
    }

    .subtitle {
      font-size: 13px;
      color: #bae6fd;
      font-weight: bold;
    }

    /* Child Dialogue Banner */
    .speech-box {
      background: #fef08a;
      border-bottom: 2px solid #fde047;
      padding: 12px 15px;
      text-align: center;
      font-size: 16px;
      font-weight: 800;
      color: #854d0e;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
    }

    /* Workspace Canvas Area */
    .canvas-container {
      position: relative;
      width: 100%;
      height: 360px;
      background: #ffffff;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    /* Controls Bottom Bar */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: #f8fafc;
      border-top: 2px solid #e2e8f0;
      gap: 10px;
    }

    .btn {
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }

    .btn:active { transform: scale(0.95); }
    .btn-replay { background: #0284c7; }
    .btn-replay:hover { background: #0369a1; }
    .btn-clear { background: #ef4444; }
    .btn-clear:hover { background: #dc2626; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="title">बाल विकास: 4-Line Tracing & Animated Story</div>
      <div class="subtitle">🌟 IOIS PLATFORM 🌟</div>
    </div>

    <!-- Speech Dialogue Banner -->
    <div class="speech-box" id="speechBox">
      🗣️ शुरू करने के लिए "ऑडियो के साथ चलाएं" बटन पर क्लिक करें!
    </div>

    <!-- Workspace Canvas -->
    <div class="canvas-container">
      <canvas id="mainCanvas"></canvas>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-replay" onclick="startAnimation()">🔄 ऑडियो के साथ चलाएं</button>
      <button class="btn btn-clear" onclick="clearUserDrawings()">🧹 अपनी ट्रेसिंग साफ़ करें</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const speechBox = document.getElementById('speechBox');

    let w, h;
    let tCapA = 0, tSmallA = 0;
    let userPaths = [], currentPath = [], isDrawing = false;
    let antLegAngle = 0; // Ant walking animation state

    function resizeCanvas() {
      w = canvas.width = canvas.offsetWidth;
      h = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // 4-Line Notebook Line Calculations (Accurate Spacing)
    function getLineY(row, lineIdx) {
      const base = row === 0 ? 40 : 190;
      return base + (lineIdx * 26);
    }

    // Capital 'A' Trajectory (Top 3 lines accurately)
    function getCapAPoint(t) {
      const l1 = getLineY(0, 0), l3 = getLineY(0, 2), midY = getLineY(0, 1.2);
      if (t <= 0.4) {
        let p = t / 0.4;
        return { x: 45 + 35 * p, y: l3 + (l1 - l3) * p }; // Slant Up Line
      } else if (t <= 0.8) {
        let p = (t - 0.4) / 0.4;
        return { x: 80 + 35 * p, y: l1 + (l3 - l1) * p }; // Slant Down Line
      } else {
        let p = (t - 0.8) / 0.2;
        return { x: 60 + 40 * p, y: midY }; // Sleeping Crossbar Line
      }
    }

    // Small 'a' Trajectory (Middle 2 lines accurately)
    function getSmallAPoint(t) {
      const l2 = getLineY(1, 1), l3 = getLineY(1, 2);
      const centerY = (l2 + l3) / 2, r = (l3 - l2) / 2, centerX = 75;
      if (t <= 0.75) {
        let angle = -(t / 0.75) * Math.PI * 2;
        return { x: centerX + Math.cos(angle) * r, y: centerY + Math.sin(angle) * r }; // Curve Circle
      } else {
        let p = (t - 0.75) / 0.25;
        return { x: centerX + r, y: l2 + (l3 - l2) * p }; // Straight Right Line
      }
    }

    // Voice Dialogue Sequence (Text-to-Speech Hindi)
    function speakText(text, callback) {
      speechBox.innerText = "🗣️ " + text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'hi-IN';
        msg.rate = 0.9;
        msg.pitch = 1.35; // Cute child voice pitch
        if (callback) msg.onend = callback;
        window.speechSynthesis.speak(msg);
      } else {
        if (callback) setTimeout(callback, 2200);
      }
    }

    // Draw Realistic 3D Glossy Apple (No Image File Needed)
    function drawRealisticApple(cx, cy) {
      ctx.save();

      // Shadow
      ctx.beginPath();
      ctx.ellipse(cx, cy + 70, 65, 14, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
      ctx.fill();

      // Stem (Teni)
      ctx.beginPath();
      ctx.moveTo(cx - 2, cy - 45);
      ctx.quadraticCurveTo(cx - 15, cy - 75, cx - 18, cy - 80);
      ctx.lineWidth = 6;
      ctx.strokeStyle = '#4a2810';
      ctx.lineCap = 'round';
      ctx.stroke();

      // Leaf (Patti)
      ctx.beginPath();
      ctx.moveTo(cx - 10, cy - 65);
      ctx.quadraticCurveTo(cx + 25, cy - 90, cx + 35, cy - 65);
      ctx.quadraticCurveTo(cx + 10, cy - 50, cx - 10, cy - 65);
      const leafGrad = ctx.createLinearGradient(cx - 10, cy - 85, cx + 35, cy - 50);
      leafGrad.addColorStop(0, '#4ade80');
      leafGrad.addColorStop(1, '#15803d');
      ctx.fillStyle = leafGrad;
      ctx.fill();

      // Apple Body Base Gradient
      ctx.beginPath();
      ctx.moveTo(cx, cy - 45);
      ctx.bezierCurveTo(cx + 45, cy - 60, cx + 80, cy - 10, cx + 70, cy + 30);
      ctx.bezierCurveTo(cx + 60, cy + 70, cx + 20, cy + 75, cx, cy + 60);
      ctx.bezierCurveTo(cx - 20, cy + 75, cx - 60, cy + 70, cx - 70, cy + 30);
      ctx.bezierCurveTo(cx - 80, cy - 10, cx - 45, cy - 60, cx, cy - 45);

      const appleGrad = ctx.createRadialGradient(cx - 20, cy - 15, 10, cx, cy, 75);
      appleGrad.addColorStop(0, '#ff4d4d');
      appleGrad.addColorStop(0.6, '#dc2626');
      appleGrad.addColorStop(1, '#7f1d1d');
      ctx.fillStyle = appleGrad;
      ctx.fill();

      // Glossy Highlights
      ctx.beginPath();
      ctx.ellipse(cx - 32, cy - 20, 15, 30, Math.PI / 6, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
      ctx.fill();

      ctx.beginPath();
      ctx.arc(cx - 20, cy - 35, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
      ctx.fill();

      // Small Eaten Piece of Apple
      ctx.beginPath();
      ctx.arc(cx + 50, cy + 45, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#fef08a';
      ctx.fill();
      ctx.strokeStyle = '#eab308';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore();
    }

    // Draw Live Ant (Crawling & Eating)
    function drawAnt(x, y) {
      ctx.save();
      ctx.translate(x, y);

      antLegAngle += 0.15;
      let legOffset = Math.sin(antLegAngle) * 4;

      // Antennae
      ctx.strokeStyle = '#1e293b';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(-12, -4); ctx.quadraticCurveTo(-18, -12, -22, -10);
      ctx.moveTo(-12, 4);  ctx.quadraticCurveTo(-18, 12, -22, 10);
      ctx.stroke();

      // Moving Legs
      ctx.beginPath();
      // Left Legs
      ctx.moveTo(0, -2); ctx.lineTo(-4 + legOffset, -12);
      ctx.moveTo(4, -2);  ctx.lineTo(4 - legOffset, -12);
      ctx.moveTo(8, -2);  ctx.lineTo(12 + legOffset, -12);
      // Right Legs
      ctx.moveTo(0, 2);  ctx.lineTo(-4 - legOffset, 12);
      ctx.moveTo(4, 2);   ctx.lineTo(4 + legOffset, 12);
      ctx.moveTo(8, 2);   ctx.lineTo(12 - legOffset, 12);
      ctx.stroke();

      // Ant Body (3 Segments: Head, Thorax, Abdomen)
      // Head
      ctx.beginPath();
      ctx.ellipse(-10, 0, 5, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#334155'; ctx.fill();

      // Eye
      ctx.beginPath();
      ctx.arc(-11, -2, 1, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff'; ctx.fill();

      // Thorax
      ctx.beginPath();
      ctx.ellipse(0, 0, 6, 4, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b'; ctx.fill();

      // Abdomen
      ctx.beginPath();
      ctx.ellipse(12, 0, 9, 6, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a'; ctx.fill();

      // Tiny apple piece in ant's mouth
      ctx.beginPath();
      ctx.arc(-16, 0, 3, 0, Math.PI * 2);
      ctx.fillStyle = '#fef08a'; ctx.fill();

      ctx.restore();
    }

    // Pencil Icon Drawing
    function drawPencil(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.fill();
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-16, -7); ctx.lineTo(-16, 7); ctx.lineTo(-8, 4); ctx.fill();
      ctx.fillStyle = '#ea580c'; ctx.fillRect(-36, -7, 20, 14);
      ctx.restore();
    }

    // Main Render Loop
    function render() {
      ctx.clearRect(0, 0, w, h);

      // 1. Draw 4-Line English Notebook Background
      for (let r = 0; r < 2; r++) {
        for (let i = 0; i < 4; i++) {
          let y = getLineY(r, i);
          ctx.beginPath();
          ctx.moveTo(20, y);
          ctx.lineTo(w - 240, y);
          ctx.strokeStyle = (i === 0 || i === 3) ? '#ef4444' : '#3b82f6';
          ctx.lineWidth = 1.5;
          if (i === 1 || i === 2) ctx.setLineDash([5, 5]);
          else ctx.setLineDash([]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // 2. Faint Template Guide Text
      ctx.fillStyle = '#f1f5f9';
      ctx.font = '900 75px sans-serif';
      ctx.fillText('A', 45, getLineY(0, 2) - 2);
      ctx.font = '900 48px sans-serif';
      ctx.fillText('a', 63, getLineY(1, 2) - 2);

      // 3. Draw Animated Tracing Pencil Strokes
      if (tCapA < 1) tCapA += 0.006;
      drawPencilStroke(getCapAPoint, tCapA, '#0284c7');

      if (tSmallA < 1) tSmallA += 0.007;
      drawPencilStroke(getSmallAPoint, tSmallA, '#dc2626');

      // 4. Draw Real 3D Apple & Crawling Ant
      const appleX = w - 120;
      const appleY = 120;
      drawRealisticApple(appleX, appleY);
      drawAnt(appleX - 45, appleY + 70);

      // Ant Label Caption
      ctx.fillStyle = '#78350f';
      ctx.font = 'bold 14px "Comic Sans MS", cursive, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🐜 चींटी की बच्ची सेब खा रही है!', appleX, appleY + 120);
      ctx.textAlign = 'left';

      // 5. Draw User Practice Tracing Lines
      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      userPaths.forEach(path => {
        ctx.beginPath();
        path.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
      });

      requestAnimationFrame(render);
    }

    function drawPencilStroke(pathFn, prog, color) {
      ctx.beginPath();
      ctx.lineWidth = 5;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let t = 0; t <= prog; t += 0.01) {
        let pt = pathFn(t);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      if (prog < 1) {
        let pt = pathFn(prog);
        drawPencil(pt.x, pt.y);
      }
    }

    // Sequence Story Function
    function startAnimation() {
      tCapA = 0;
      tSmallA = 0;
      speakText("हेलो दोस्तों! यह है Capital A और Small a!", () => {
        speakText("A for Apple! Apple का मतलब सेब!", () => {
          speakText("अरे वाह! यह सेब तो बहुत मीठा है! 🍎", () => {
            speakText("और देखो, नीचे चींटी की बच्ची भी मजे से सेब खा रही है! 🐜");
          });
        });
      });
    }

    // User Interactive Practice Drawing
    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      let rect = canvas.getBoundingClientRect();
      currentPath = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
      userPaths.push(currentPath);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      let rect = canvas.getBoundingClientRect();
      currentPath.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
    });

    canvas.addEventListener('mouseup', () => isDrawing = false);

    function clearUserDrawings() { userPaths = []; }

    // Start Engine
    render();
  </script>
</body>
</html>
