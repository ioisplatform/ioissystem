<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A for Apple - Animated Tracing Notebook</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Comic Sans MS', cursive, 'Segoe UI', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
      user-select: none;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      border-radius: 24px;
      border: 4px solid #0284c7;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(2, 132, 199, 0.2);
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0284c7, #0369a1);
      color: #ffffff;
      padding: 16px;
      text-align: center;
    }

    .title {
      font-size: 24px;
      font-weight: 900;
    }

    .subtitle {
      font-size: 13px;
      color: #bae6fd;
      font-weight:bold;
    }

    /* Dialogue Banner */
    .speech-box {
      background: #fef08a;
      border-bottom: 2px solid #fde047;
      padding: 12px;
      text-align: center;
      font-size: 15px;
      font-weight: 800;
      color: #854d0e;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Canvas Box */
    .canvas-container {
      position: relative;
      width: 100%;
      height: 330px;
      background: #ffffff;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Controls */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: #f8fafc;
      border-top: 2px solid #e2e8f0;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.1s ease;
    }

    .btn:active { transform: scale(0.95); }
    .btn-replay { background: #0284c7; }
    .btn-clear { background: #ef4444; }
  </style>
</head>
<body>

  <div class="card">
    <!-- Header -->
    <div class="header">
      <div class="title">बाल विकास: 4-Line Tracing Notebook</div>
      <div class="subtitle">🌟 IOIS PLATFORM 🌟</div>
    </div>

    <!-- Speech Dialogue Banner -->
    <div class="speech-box" id="speechBox">
      🔊 शुरू करने के लिए "फिर से शुरू करें" पर क्लिक करें!
    </div>

    <!-- Workspace Canvas -->
    <div class="canvas-container">
      <canvas id="mainCanvas"></canvas>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-replay" onclick="startAnimation()">🔄 फिर से शुरू करें & आवाज़ सुनें</button>
      <button class="btn btn-clear" onclick="clearUserDrawings()">🧹 ट्रेसिंग साफ़ करें</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const speechBox = document.getElementById('speechBox');

    let w, h;
    let tCapA = 0, tSmallA = 0;
    let userPaths = [], currentPath = [], isDrawing = false;

    // Real Photo from generated image
    const realAppleImg = new Image();
    realAppleImg.src = "watermarked_img_2507508125906239839.png";

    function resizeCanvas() {
      w = canvas.width = canvas.offsetWidth;
      h = canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // English 4-Line Notebook Geometry
    function getLineY(row, lineIdx) {
      const base = row === 0 ? 35 : 180;
      return base + (lineIdx * 26);
    }

    // Capital 'A' Trajectory (Top 3 lines)
    function getCapAPoint(t) {
      const l1 = getLineY(0, 0), l3 = getLineY(0, 2), midY = getLineY(0, 1.2);
      if (t <= 0.4) {
        let p = t / 0.4;
        return { x: 45 + 35 * p, y: l3 + (l1 - l3) * p };
      } else if (t <= 0.8) {
        let p = (t - 0.4) / 0.4;
        return { x: 80 + 35 * p, y: l1 + (l3 - l1) * p };
      } else {
        let p = (t - 0.8) / 0.2;
        return { x: 60 + 40 * p, y: midY };
      }
    }

    // Small 'a' Trajectory (Middle 2 lines)
    function getSmallAPoint(t) {
      const l2 = getLineY(1, 1), l3 = getLineY(1, 2);
      const centerY = (l2 + l3) / 2, r = (l3 - l2) / 2, centerX = 75;
      if (t <= 0.75) {
        let angle = -(t / 0.75) * Math.PI * 2;
        return { x: centerX + Math.cos(angle) * r, y: centerY + Math.sin(angle) * r };
      } else {
        let p = (t - 0.75) / 0.25;
        return { x: centerX + r, y: l2 + (l3 - l2) * p };
      }
    }

    // Voice Dialogue Sequence
    function speakText(text, callback) {
      speechBox.innerText = "🗣️ " + text;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'hi-IN';
        msg.rate = 0.9;
        msg.pitch = 1.2; // Kid-like tone
        if (callback) msg.onend = callback;
        window.speechSynthesis.speak(msg);
      } else {
        if (callback) setTimeout(callback, 2000);
      }
    }

    // Animation Render Loop
    function render() {
      ctx.clearRect(0, 0, w, h);

      // 1. Draw 4-Line Notebook Background
      for (let r = 0; r < 2; r++) {
        for (let i = 0; i < 4; i++) {
          let y = getLineY(r, i);
          ctx.beginPath();
          ctx.moveTo(20, y);
          ctx.lineTo(w - 220, y);
          ctx.strokeStyle = (i === 0 || i === 3) ? '#ef4444' : '#3b82f6';
          ctx.lineWidth = 1.5;
          if (i === 1 || i === 2) ctx.setLineDash([5, 5]);
          else ctx.setLineDash([]);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      // 2. Faint Template Guide
      ctx.fillStyle = '#f1f5f9';
      ctx.font = '900 75px sans-serif';
      ctx.fillText('A', 45, getLineY(0, 2) - 2);
      ctx.font = '900 48px sans-serif';
      ctx.fillText('a', 63, getLineY(1, 2) - 2);

      // 3. Draw Animated Pencil Strokes
      if (tCapA < 1) tCapA += 0.006;
      drawPencilStroke(getCapAPoint, tCapA, '#0284c7');

      if (tSmallA < 1) tSmallA += 0.007;
      drawPencilStroke(getSmallAPoint, tSmallA, '#dc2626');

      // 4. Render Real Live Apple & Ant Photo
      if (realAppleImg.complete) {
        ctx.drawImage(realAppleImg, w - 210, 20, 195, 195);
        ctx.fillStyle = '#78350f';
        ctx.font = 'bold 15px "Comic Sans MS", cursive, sans-serif';
        ctx.fillText('🐜 चींटी की बच्ची सेब खा रही है!', w - 210, 235);
      }

      // 5. Draw User Practice Traces
      ctx.strokeStyle = '#16a34a';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      userPaths.forEach(path => {
        ctx.beginPath();
        path.forEach((pt, i) => {
          if (i === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();
      });

      requestAnimationFrame(render);
    }

    function drawPencilStroke(pathFn, prog, color) {
      ctx.beginPath();
      ctx.lineWidth = 5;
      ctx.strokeStyle = color;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      for (let t = 0; t <= prog; t += 0.01) {
        let pt = pathFn(t);
        if (t === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.stroke();

      if (prog < 1) {
        let pt = pathFn(prog);
        drawPencil(pt.x, pt.y);
      }
    }

    function drawPencil(x, y) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = '#1e293b';
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-8, -4); ctx.lineTo(-8, 4); ctx.fill();
      ctx.fillStyle = '#fde047';
      ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(-16, -7); ctx.lineTo(-16, 7); ctx.lineTo(-8, 4); ctx.fill();
      ctx.fillStyle = '#ea580c'; ctx.fillRect(-36, -7, 20, 14);
      ctx.restore();
    }

    // Story Loop with Audio & Animation
    function startAnimation() {
      tCapA = 0;
      tSmallA = 0;
      speakText("यह है Capital A और Small a!", () => {
        speakText("A for Apple! Apple का मतलब सेब!", () => {
          speakText("अरे वाह! यह सेब तो बहुत मीठा है! 🍎", () => {
            speakText("और देखो, नीचे चींटी की बच्ची भी सेब खा रही है! 🐜");
          });
        });
      });
    }

    // User Interactive Tracing
    canvas.addEventListener('mousedown', (e) => {
      isDrawing = true;
      let rect = canvas.getBoundingClientRect();
      currentPath = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
      userPaths.push(currentPath);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      let rect = canvas.getBoundingClientRect();
      currentPath.push({ x: e.clientX - rect.left, y: e.clientY - rect.top });
    });

    canvas.addEventListener('mouseup', () => isDrawing = false);

    function clearUserDrawings() { userPaths = []; }

    realAppleImg.onload = () => {
      render();
    };
  </script>
</body>
</html>
